<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="google-site-verification" content="DjcprG6EDZYXybz9fFyDqEQE7mIPvmsJXTnEDVi7J6c">
  <title>منصة العروض التقديمية | مولّد عروض المشاريع</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=3">
  <link rel="manifest" href="/assets/site.webmanifest">
  <meta name="theme-color" content="#07182C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="/assets/i18n.bundle.js"></script>
<script src="/assets/i18n.js"></script>
  <link rel="stylesheet" href="/assets/app.bundle.css">
</head>


<body>

  <!-- Global Loading Indicator (Non-blocking Floating Card) -->
  <div id="globalLoader"
    style="display:none;position:fixed;top:24px;left:24px;z-index:99999;align-items:center;justify-content:flex-start;font-family:inherit">
    <div class="global-loader-card">
      <div class="global-loader-header">
        <div class="global-loader-heading">
          <h4 id="globalLoaderTitle" style="margin:0 0 2px;color:var(--p);font-size:14px;font-weight:700">جاري
            التحميل...</h4>
          <p id="globalLoaderText" style="margin:0;color:var(--muted);font-size:12px;line-height:1.4"></p>
        </div>
        <span id="globalLoaderPct" class="global-loader-percent" aria-live="polite">0%</span>
        <button id="globalLoaderStopButton" type="button" class="global-loader-stop" style="display:none"
          data-i18n="gen.stop" onclick="stopTenantGeneration()">إيقاف</button>
        <button onclick="closeGenerationPopup()" class="global-loader-cancel" title="إغلاق وإيقاف المهمة">×</button>
      </div>
      <div id="globalLoaderProgress" class="global-loader-progress">
        <div class="global-loader-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
          aria-valuenow="0">
          <div id="globalLoaderBar" class="global-loader-progress-fill"></div>
        </div>
        <div class="global-loader-progress-meta">
          <span id="globalLoaderStep" aria-live="polite">جاري التحضير...</span>
          <span id="globalLoaderEstimate"></span>
        </div>
        <div id="globalLoaderSteps" class="global-loader-steps" hidden></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- ═══════════════════ Tenant Multi-Tenant UI ═══════════════════ -->
  <div id="tenantAuthPage" class="tenant-auth">
    <div class="auth-card">
      <button type="button" class="lang-toggle-btn auth-lang-toggle" onclick="toggleAppLanguage()">English</button>
      <div class="auth-brand">
        <img class="auth-brand-logo" src="/assets/landloom-logo.png?v=3" alt="LandLoom">
        <span class="auth-brand-beta" data-i18n="auth.beta">نسخة تجريبية</span>
        <p class="auth-brand-tag" data-i18n="auth.tagline">منصة توليد العروض والدراسات العقارية</p>
      </div>
      <div class="auth-body">
        <p class="auth-title" data-i18n="auth.sign_in">تسجيل الدخول</p>

        <div id="loginError" class="auth-error"></div>
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
          <label data-i18n="auth.email">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" autocomplete="email" required>
          <label data-i18n="auth.password">كلمة المرور</label>
          <div style="position:relative">
            <input type="password" id="loginPassword" placeholder="كلمة المرور" data-i18n-ph="auth.password" required style="padding-left:64px">
            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:#07182C;font-weight:800;font-size:13px;font-family:inherit;cursor:pointer;padding:4px 6px">إظهار</button>
          </div>
          <button type="submit" class="auth-btn" data-i18n="auth.login">دخول</button>
        </form>
        <form id="loginOtpForm" class="auth-form" onsubmit="handleLoginOtpVerify(event)" style="display:none">
          <p class="tenant-hint" id="loginOtpHint" style="margin-bottom:14px;text-align:center;color:#475569;font-weight:600" data-i18n="auth.otp_hint_generic">رمز التحقق مرسل إلى البريد الإلكتروني</p>
          <label style="text-align:center;margin-bottom:8px" data-i18n="auth.otp_code_label">رمز التحقق</label>

          <div class="otp-boxes" dir="ltr" id="loginOtpBoxes">
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="0" autofocus>
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="1">
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="2">
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="3">
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="4">
            <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-index="5">
          </div>
          <input type="hidden" id="loginOtpInput" name="otp" required>

          <button type="submit" class="auth-btn" id="loginOtpSubmitBtn" data-i18n="auth.otp_confirm">تأكيد الرمز</button>
          <div class="auth-secondary-actions">
            <button type="button" class="btn ghost small" id="loginOtpResendBtn" onclick="handleLoginOtpResend()" data-i18n="auth.otp_resend">إعادة إرسال الرمز</button>
            <button type="button" class="btn ghost small" onclick="handleLoginOtpCancel()" data-i18n="auth.otp_back">الرجوع</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="tenantAppPage" class="tenant-app">
<!--__INDEX_PARTS__-->
  </div><!-- close tenantAppPage -->

    <script src="/assets/vendor/yjs.min.js"></script>
    <script src="/assets/app.bundle.js"></script>

</body>

</html>
