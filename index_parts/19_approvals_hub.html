    <!-- Approvals Hub -->
    <section id="tenantApprovalsPage" class="tenant-page">
      <div class="tenant-page-heading">
        <div>
          <span class="tenant-page-kicker" data-i18n="approvals.kicker">الحوكمة والقرارات</span>
          <h2 style="display:inline-flex;align-items:center;gap:10px">
            <span data-i18n="nav.approvals">مركز التعميدات</span>
            <span id="approvalsCountBadge" class="tenant-badge status-warning" style="font-size:13px;font-weight:700">0</span>
          </h2>
        </div>
        <div class="tenant-actions">
          <button type="button" class="btn ghost small" onclick="openTenantApprovals(true)">
            <span data-i18n="admin.refresh">تحديث</span>
          </button>
        </div>
      </div>

      <!-- Approvals Stats Strip -->
      <div id="approvalsStatsStrip" class="tenant-projects-stats-strip" style="margin-bottom:20px">
        <div class="tenant-project-stat-chip">
          <span class="stat-num" id="statPendingApprovals">0</span>
          <span class="stat-lbl" data-i18n="approvals.stat_pending">بانتظار التعميد</span>
        </div>
        <div class="tenant-project-stat-chip">
          <span class="stat-num" id="statGenApprovals">0</span>
          <span class="stat-lbl" data-i18n="approvals.stat_generation">اعتماد التوليد والمحتوى</span>
        </div>
        <div class="tenant-project-stat-chip">
          <span class="stat-num" id="statSectionApprovals">0</span>
          <span class="stat-lbl" data-i18n="approvals.stat_sections">اعتماد الأقسام</span>
        </div>
        <div class="tenant-project-stat-chip">
          <span class="stat-num" id="statDecidedApprovals">0</span>
          <span class="stat-lbl" data-i18n="approvals.stat_decided">سجل القرارات السابقة</span>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="tenant-approvals-tabs">
        <button type="button" class="btn small primary" id="tabPendingApprovalsBtn" onclick="switchApprovalsTab('pending')">
          <span data-i18n="approvals.tab_pending">بانتظار التعميد</span>
          <span id="tabPendingCountBadge" style="opacity:0.9">(0)</span>
        </button>
        <button type="button" class="btn small ghost" id="tabHistoryApprovalsBtn" onclick="switchApprovalsTab('history')">
          <span data-i18n="approvals.tab_history">سجل القرارات والتعميدات</span>
          <span id="tabHistoryCountBadge" style="opacity:0.7">(0)</span>
        </button>
      </div>

      <!-- Tab Content: Pending -->
      <div id="approvalsPendingView">
        <div id="approvalsList"></div>
      </div>

      <!-- Tab Content: History -->
      <div id="approvalsHistoryView" style="display:none">
        <div id="approvalsHistoryList"></div>
      </div>
    </section>
