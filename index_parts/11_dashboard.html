    <!-- Dashboard -->
    <section id="tenantDashboardPage" class="tenant-page active">
      <div class="tenant-page-heading tenant-dashboard-heading">
        <div>
          <span class="tenant-page-kicker" data-i18n="dashboard.summary">ملخص الأداء</span>
          <h2 data-i18n="dashboard.overview">نظرة عامة</h2>
        </div>
        <button type="button" class="btn primary" data-permission="create_presentation"
          onclick="startTenantProject()" data-i18n="nav.new_proposal">مشروع جديد</button>
      </div>
      <div id="dashboardStats" class="tenant-dashboard-stats">
        <div class="tenant-dash-card stat">
          <h3 id="dashStatTotal">0</h3>
          <p data-i18n="dashboard.total_presentations">إجمالي العروض</p>
        </div>
        <div class="tenant-dash-card stat tenant-admin-only">
          <h3 id="dashStatPending">0</h3>
          <p data-i18n="dashboard.pending_approvals">بانتظار التعميد</p>
        </div>
        <div class="tenant-dash-card tenant-balance-card tenant-admin-only" data-permission="billing"
          id="dashboardBalanceCard">
          <p data-i18n="dashboard.balance_remaining">الرصيد المتبقي</p>
          <div class="tenant-balance-main">
            <h3 id="dashBalanceValue">0</h3>
            <span class="tenant-balance-pill" id="dashBalancePill" hidden></span>
          </div>
          <div class="tenant-balance-bar"><span id="dashBalanceBar"></span></div>
          <div class="tenant-balance-sub" id="dashBalanceSub"></div>
        </div>
      </div>
      <div id="dashboardLifecycle" class="tenant-dashboard-stats" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"></div>
      <div id="dashboardRecentSection" class="tenant-content-panel tenant-recent-projects-panel">
        <div class="tenant-panel-heading">
          <div>
            <h3 class="dash-section-title" data-i18n="dashboard.recent_projects">المشاريع والعروض الأخيرة</h3>
            <span class="tenant-panel-subtitle" data-i18n="dashboard.recent_projects_sub">أحدث الدراسات والعروض العقارية في مساحة العمل</span>
          </div>
          <button type="button" class="btn ghost small" onclick="openTenantPage('tenantPresentationsPage')" data-i18n="dashboard.view_all_projects">عرض جميع العروض</button>
        </div>
        <div id="dashRecentProjects" class="tenant-recent-projects-body"></div>
      </div>
      <div class="tenant-content-panel admin-chart-panel">
        <div class="tenant-panel-heading">
          <h3 class="dash-section-title" data-i18n="dashboard.company_activity">نشاط الشركة</h3>
          <div class="admin-chart-heading-side">
            <div class="admin-chart-legend" id="tenantActivityLegend"></div>
            <div class="admin-range" id="tenantActivityRange"></div>
          </div>
        </div>
        <div id="tenantActivityChart" class="admin-chart"></div>
      </div>
    </section>
