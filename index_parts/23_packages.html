
    <!-- Packages catalog: the super-admin's dedicated desk -->
    <section id="tenantAdminPackagesPage" class="tenant-page">
      <div class="tenant-page-heading">
        <div>
          <span class="tenant-page-kicker" data-i18n="chrome.platform">إدارة المنصة</span>
          <h2 data-i18n="nav.packages">الباقات</h2>
        </div>
      </div>
      <div class="tenant-content-panel">
        <div class="tenant-panel-heading">
          <h3 class="dash-section-title" data-i18n="admin.packages_title">الباقات والأسعار</h3>
        </div>
        <div id="adminPackagesList"></div>
        <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:14px 0 0">
          <div class="tenant-field" style="margin:0">
            <label data-i18n="admin.package_tax_rate">نسبة الضريبة %</label>
            <input type="number" id="adminPackageTaxRate" min="0" max="99" step="0.01" dir="ltr" style="max-width:140px">
          </div>
          <button type="button" class="btn ghost small" id="adminTaxRateSave" onclick="adminSaveTaxRate()" data-i18n="admin.package_tax_save">حفظ النسبة</button>
        </div>
        <div class="pkg-editor">
        <form onsubmit="adminSavePackage(event)"><div class="tenant-grid">
          <div class="tenant-field">
            <label data-i18n="admin.package_name">اسم الباقة</label>
            <input type="text" id="adminPackageName" maxlength="80" required>
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_name_en">اسم الباقة بالإنجليزية</label>
            <input type="text" id="adminPackageNameEn" dir="ltr" maxlength="80">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_price_sar">السعر بالريال السعودي</label>
            <input type="number" id="adminPackagePrice" min="0" step="0.01" required dir="ltr">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_credit_sar">الرصيد بالنقاط</label>
            <input type="number" id="adminPackageCredit" min="0" step="0.01" readonly dir="ltr">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_duration">الصلاحية (أيام)</label>
            <input type="number" id="adminPackageDuration" min="0" step="1" dir="ltr">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_badge">الشارة</label>
            <input type="text" id="adminPackageBadge" maxlength="80">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_badge_en">الشارة بالإنجليزية</label>
            <input type="text" id="adminPackageBadgeEn" dir="ltr" maxlength="80">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_tagline">السطر التوضيحي</label>
            <input type="text" id="adminPackageTagline" maxlength="160">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_tagline_en">السطر التوضيحي بالإنجليزية</label>
            <input type="text" id="adminPackageTaglineEn" dir="ltr" maxlength="160">
          </div>
          <div class="tenant-field">
            <label data-i18n="admin.package_featured">باقة مميزة</label>
            <input type="checkbox" id="adminPackageFeatured" style="width:auto">
          </div>
          <div class="tenant-field full">
            <label data-i18n="admin.package_features">المزايا المتاحة في الباقة</label>
            <div id="adminPackageFeaturesChecklist" class="pkg-feat-checklist"></div>
          </div>
        </div><div class="sag-modal-actions">
          <button type="submit" class="btn primary" id="adminPackageSubmit" data-i18n="admin.package_save">حفظ الباقة</button>
          <button type="button" class="btn ghost" id="adminPackageCancel" style="display:none" onclick="adminCancelPackageEdit()">إلغاء</button></div>
        </form>
        <aside class="pkg-preview" aria-hidden="true">
          <div class="pkg-preview-label" data-i18n="admin.package_preview">معاينة الكارت</div>
          <div id="adminPackagePreview"></div>
        </aside>
        </div>
      </div>
    </section>
