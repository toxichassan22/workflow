name: Apply designer chat reliability fix

on:
  push:
    branches:
      - fix/designer-chat-reliability
    paths:
      - .github/workflows/apply-designer-chat-reliability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack implementation
        run: |
          echo '' | base64 -d > /tmp/designer-chat-fix.tar.gz
          tar -xzf /tmp/designer-chat-fix.tar.gz
      - name: Apply source changes
        run: python scripts/apply_designer_chat_wrapper.py
      - name: Validate implementation
        run: |
          python -m py_compile app.py designer_chat_reliability.py scripts/apply_designer_chat_wrapper.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('reliability_tests', 'tests/test_designer_chat_reliability.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          count = 0
          for name in sorted(dir(module)):
              if name.startswith('test_'):
                  getattr(module, name)()
                  count += 1
          print(f'{count} designer chat reliability tests passed')
          PY
      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-designer-chat-reliability.yml
          rm -f .github/workflows/extract-designer-context.yml
          rm -f scripts/apply_designer_chat_wrapper.py scripts/extract_designer_context.py
          rm -rf tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix designer chat reliability and slide splitting"
          git push
