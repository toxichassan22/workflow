name: Apply canonical caption metadata fix

on:
  push:
    branches:
      - fix/visible-image-captions

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-image-captions
      - name: Persist captions through visual rebuilds
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/caption-metadata.patch
          git apply --check /tmp/caption-metadata.patch
          git apply /tmp/caption-metadata.patch
          python -m py_compile designer_chat_reliability.py tests/test_designer_chat_reliability.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/test_designer_chat_reliability.py')
          spec = importlib.util.spec_from_file_location('caption_tests', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = sorted(name for name in dir(module) if name.startswith('test_'))
          for name in tests:
              getattr(module, name)()
          print(f'{len(tests)} reliability tests passed')
          PY
          rm -f /tmp/caption-metadata.patch
          git rm .github/workflows/apply-caption-metadata.yml
          git add designer_chat_reliability.py tests/test_designer_chat_reliability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist visual captions in canonical slide metadata'
          git push origin HEAD:fix/visible-image-captions
