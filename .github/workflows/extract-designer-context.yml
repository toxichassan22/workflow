name: Extract designer chat context

on:
  push:
    branches:
      - fix/designer-chat-reliability
    paths:
      - .github/workflows/extract-designer-context.yml
      - scripts/extract_designer_context.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant frontend source
        run: python scripts/extract_designer_context.py
      - name: Commit extracted context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/designer_context.txt
          git diff --cached --quiet || git commit -m "Extract designer chat frontend context"
          git push
