name: Auto Deploy to Staging Hosting

# Lab copy next to production. Pushes to lab deploy origin/lab into
# proposal-generator-staging; production (deploy.yml, manual only) is untouched.
# Required repository secrets:
#   STAGING_BASE_URL       e.g. https://test.example.com (no trailing slash needed)
#   DEPLOY_WEBHOOK_SECRET  same webhook secret the server expects

on:
  push:
    branches:
      - lab
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Staging Deployment Webhook
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "STAGING_BASE_URL secret is not configured"
            exit 1
          fi
          base="${STAGING_BASE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 120 -X POST --data '' "$base/api/deploy-webhook-staging?secret=${{ secrets.DEPLOY_WEBHOOK_SECRET }}&commit=${{ github.sha }}"

      - name: Verify staged commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          expected_short="${EXPECTED_COMMIT:0:7}"
          for attempt in $(seq 1 36); do
            health="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/health?deploy_check=${EXPECTED_COMMIT}")"
            deployed="$(printf '%s' "$health" | jq -r '.deployed_commit // .commit // "unknown"')"
            echo "Staging check ${attempt}/36: deployed=${deployed} expected=${EXPECTED_COMMIT}"
            if [ "$deployed" = "$EXPECTED_COMMIT" ] || [[ "$deployed" == "$expected_short"* ]]; then
              echo "Verified staged commit ${deployed}"
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not report expected commit ${EXPECTED_COMMIT}"
          exit 1

      - name: Verify staging land analysis route
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          route_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data '{}' \
            "$base/api/extract-croquis")"
          if [ "$route_status" != "401" ]; then
            echo "Expected staging /api/extract-croquis to require authentication, got HTTP ${route_status}"
            exit 1
          fi
          echo "Verified staging /api/extract-croquis route (HTTP 401 without credentials)"
